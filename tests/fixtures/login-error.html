<!DOCTYPE html><html lang="en-US"><head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Log In | League of Comic Geeks</title>
</head><body class="page-template-default">
<header id="content-header">
    <section id="login-banner" class="content-header-section">
        <h1 class="content-title color-primary">Log In</h1>
    </section>
</header>
<div id="main-content">
    <form action="https://leagueofcomicgeeks.com/login" class="grid-form" method="post" accept-charset="utf-8">
        <input type="hidden" name="ci_csrf_token" value="">
        <div class="alert alert-error">Invalid Username and/or Password. Please double-check and try again.</div>
        <input type="text" name="username" value="someuser">
        <input type="password" name="password" autocomplete="current-password">
        <input type="submit" name="submit" id="submit" value="Continue" class="btn btn-gradient">
    </form>
</div>
</body></html>
